# ============================================================
# 副本一致性协调组件配置（进程内模拟 Raft 集群，无外部中间件）
# ============================================================

# Web 服务端口（仅用于本地手工驱动/观察）
server.port=8080

# 集群副本 ID 列表；列表大小决定多数派 quorum = floor(n/2)+1
consensus.node-ids[0]=n1
consensus.node-ids[1]=n2
consensus.node-ids[2]=n3

# 各副本持久化目录（WAL 日志、快照、投票元数据），每个副本一个子目录
consensus.data-dir=target/consensus-data

# 单副本保留日志条目数超过该阈值时，对已提交前缀做快照压缩；<=0 表示关闭快照
consensus.snapshot-threshold=5

# 选举 tick 的步进参数（保留配置，当前同步模型下由调用方显式驱动）
consensus.election-ticks=1
