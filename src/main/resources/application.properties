# 本组件为进程内一致性模拟，不依赖 Web 容器；以非 Web 模式启动，避免占用端口
spring.main.web-application-type=none

# ===== 进程内副本一致性演示组件配置 =====
# 启动时是否运行一致性演示（选举/幂等/分区/恢复）
consensus.demo.enabled=true
# 集群副本数（建议 3 或 5）
consensus.demo.nodes=5
# 选举超时（逻辑 tick，非真实时间）
consensus.demo.election-timeout-min=8
consensus.demo.election-timeout-range=8
# 领导者心跳间隔（tick）
consensus.demo.heartbeat-interval=3
# 快照后保留日志条数阈值，达到即压缩生成快照
consensus.demo.snapshot-threshold=6
# 单次等待（选举/提交/收敛）的最大 tick 预算
consensus.demo.tick-budget=120
